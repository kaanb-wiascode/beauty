name: Refresh dependency lockfiles

on:
  push:
    branches: [docs/repository-audit-2026-09]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: docs/repository-audit-2026-09

      - name: Setup pnpm and Node
        uses: pnpm/setup@v1
        with:
          version: 11.9.0
          runtime: node@22.13.1
          install: false

      - name: Refresh workspace lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Refresh web lockfile
        working-directory: apps/web
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit lockfile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps/web/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "chore(deps): refresh dependency lockfiles"
          git push origin HEAD:docs/repository-audit-2026-09
