name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and Node
        uses: pnpm/setup@v1
        with:
          version: 11.9.0
          runtime: node@22.13.1
          install: false

      - name: Audit workspace dependencies
        run: pnpm audit --audit-level high

      - name: Audit web dependencies
        working-directory: apps/web
        run: pnpm audit --audit-level high
