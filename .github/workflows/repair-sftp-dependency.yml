name: Repair SFTP runtime dependency

on:
  push:
    branches:
      - feature/core-commerce-foundation
    paths:
      - .github/workflows/repair-sftp-dependency.yml

permissions:
  contents: write

concurrency:
  group: repair-sftp-runtime-dependency
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/core-commerce-foundation
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Add pinned SFTP runtime dependency
        run: pnpm --filter api add ssh2-sftp-client@12.1.1 --save-exact

      - name: Commit lockfile-safe dependency update and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-sftp-dependency.yml
          git add apps/api/package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes were required."
            exit 0
          fi
          git commit -m "fix(finance): add iyzico SFTP runtime dependency"
          git push origin HEAD:feature/core-commerce-foundation
