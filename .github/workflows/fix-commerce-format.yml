name: Fix commerce formatting debt

on:
  push:
    branches:
      - feature/core-commerce-foundation
    paths:
      - .github/workflows/fix-commerce-format.yml

permissions:
  contents: write

concurrency:
  group: fix-commerce-format
  cancel-in-progress: false

jobs:
  format:
    name: Format commerce release surface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: feature/core-commerce-foundation
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Format commerce release surface
        run: >-
          pnpm --filter api exec prettier --write
          "src/modules/commerce/**/*.ts"
          "src/modules/packages/**/*.ts"
          "src/modules/sales/**/*.ts"
          "src/modules/sessions/**/*.ts"
          "src/modules/appointments/**/*.ts"
          "src/app.module.ts"

      - name: Validate formatting diff
        run: git diff --check

      - name: Commit formatting only
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/app.module.ts             apps/api/src/modules/commerce             apps/api/src/modules/packages             apps/api/src/modules/sales             apps/api/src/modules/sessions             apps/api/src/modules/appointments
          git commit -m "chore(lint): format commerce release surface"
          git pull --rebase origin feature/core-commerce-foundation
          git push origin HEAD:feature/core-commerce-foundation
