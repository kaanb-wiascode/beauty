name: Production container build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-image:
    name: Build API image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: valoo-api:${{ github.sha }}
          build-args: |
            RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=valoo-api
          cache-to: type=gha,mode=max,scope=valoo-api

      - name: Scan API image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: valoo-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      # Trivy ignore-unfixed is not sufficient to exclude an unpatched package.
      # Assert vulnerable tooling is not shipped to the runtime image.
      - name: Reject braces and node-forge in API production filesystem
        shell: bash
        run: |
          docker run --rm --entrypoint /bin/sh valoo-api:${{ github.sha }} -eu -c '
            matches=$(find /app -type f \( -path "*/braces/package.json" -o -path "*/node-forge/package.json" \) -print)
            if [ -n "$matches" ]; then
              echo "Unpatched security-sensitive package detected in production filesystem:"
              printf "%s\\n" "$matches"
              exit 1
            fi
            echo "No braces or node-forge package installed in API production filesystem."
          '

  web-image:
    name: Build Web image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: valoo-web:${{ github.sha }}
          build-args: |
            API_URL=http://api:3000
            RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=valoo-web
          cache-to: type=gha,mode=max,scope=valoo-web

      - name: Scan Web image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: valoo-web:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      # Trivy ignore-unfixed is not sufficient to exclude an unpatched package.
      # Assert vulnerable tooling is not shipped to the runtime image.
      - name: Reject braces and node-forge in Web production filesystem
        shell: bash
        run: |
          docker run --rm --entrypoint /bin/sh valoo-web:${{ github.sha }} -eu -c '
            matches=$(find /app -type f \( -path "*/braces/package.json" -o -path "*/node-forge/package.json" \) -print)
            if [ -n "$matches" ]; then
              echo "Unpatched security-sensitive package detected in production filesystem:"
              printf "%s\\n" "$matches"
              exit 1
            fi
            echo "No braces or node-forge package installed in Web production filesystem."
          '

  marketing-image:
    name: Build Marketing image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Marketing production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/marketing/Dockerfile
          push: false
          load: true
          tags: valoo-marketing:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=http://localhost:3002
            NEXT_PUBLIC_API_URL=/backend
            RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=valoo-marketing
          cache-to: type=gha,mode=max,scope=valoo-marketing

      - name: Scan Marketing image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: valoo-marketing:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      # Trivy ignore-unfixed is not sufficient to exclude an unpatched package.
      # Assert vulnerable tooling is not shipped to the runtime image.
      - name: Reject braces and node-forge in Marketing production filesystem
        shell: bash
        run: |
          docker run --rm --entrypoint /bin/sh valoo-marketing:${{ github.sha }} -eu -c '
            matches=$(find /app -type f \( -path "*/braces/package.json" -o -path "*/node-forge/package.json" \) -print)
            if [ -n "$matches" ]; then
              echo "Unpatched security-sensitive package detected in production filesystem:"
              printf "%s\\n" "$matches"
              exit 1
            fi
            echo "No braces or node-forge package installed in Marketing production filesystem."
          '
