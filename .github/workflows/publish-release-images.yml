name: Publish release images

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-release-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release SHA
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.validate.outputs.release_sha }}
    steps:
      - name: Validate SHA format
        id: validate
        shell: bash
        run: |
          sha="${{ inputs.release_sha }}"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full lowercase 40-character Git SHA" >&2
            exit 1
          fi
          echo "release_sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1

  publish-api:
    name: Publish API image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.release_sha }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/beauty-api:${{ needs.validate.outputs.release_sha }}
          build-args: |
            RELEASE_SHA=${{ needs.validate.outputs.release_sha }}
          sbom: true
          provenance: mode=max

  publish-web:
    name: Publish Web image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.release_sha }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/beauty-web:${{ needs.validate.outputs.release_sha }}
          build-args: |
            API_URL=http://api:3000
            RELEASE_SHA=${{ needs.validate.outputs.release_sha }}
          sbom: true
          provenance: mode=max
