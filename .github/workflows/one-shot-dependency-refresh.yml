name: One-time patched dependency lockfile refresh

on:
  push:
    branches:
      - feature/core-commerce-foundation
    paths:
      - .github/workflows/one-shot-dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.repository == 'kaanb-wiascode/beauty' && github.ref == 'refs/heads/feature/core-commerce-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact development branch
        uses: actions/checkout@v6
        with:
          ref: feature/core-commerce-foundation
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Refresh lockfile for patched package versions
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify production vulnerabilities are resolved
        run: pnpm audit --prod --audit-level=high

      - name: Commit only lockfile and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add pnpm-lock.yaml
          git rm -- .github/workflows/one-shot-dependency-refresh.yml
          git -c user.name='valoo-ci[bot]' -c user.email='valoo-ci@users.noreply.github.com' \
            commit -m 'fix(security): refresh patched pnpm lockfile'
          git push origin HEAD:feature/core-commerce-foundation
