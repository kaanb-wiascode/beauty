name: Monorepo quality

on:
  push:
    branches:
      - main
      - feature/core-commerce-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beauty_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beauty_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beauty_ci?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: beauty-ci-access-secret-2026-very-long
      JWT_REFRESH_SECRET: beauty-ci-refresh-secret-2026-very-long

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter @beauty-erp/database validate

      - name: Apply database migrations
        run: pnpm --filter @beauty-erp/database migrate:deploy

      - name: Generate Prisma client
        run: pnpm --filter @beauty-erp/database generate

      - name: Typecheck database package
        run: pnpm --filter @beauty-erp/database typecheck

      - name: Build database package
        run: pnpm --filter @beauty-erp/database build

      - name: Typecheck shared commerce contracts
        run: pnpm --filter @beauty-erp/types typecheck

      - name: Build shared commerce contracts
        run: pnpm --filter @beauty-erp/types build

      - name: Report commerce lint debt
        continue-on-error: true
        run: >-
          pnpm --filter api exec eslint
          "src/modules/commerce/**/*.ts"
          "src/modules/packages/**/*.ts"
          "src/modules/sales/**/*.ts"
          "src/modules/sessions/**/*.ts"
          "src/modules/appointments/**/*.ts"
          "src/app.module.ts"
          --no-error-on-unmatched-pattern

      - name: Typecheck API
        run: pnpm --filter api typecheck

      - name: Test API
        run: pnpm --filter api test:ci

      - name: Test API E2E
        run: pnpm --filter api exec jest --config ./test/jest-e2e.json --runInBand

      - name: Build API
        run: pnpm --filter api build

      - name: Lint web
        run: pnpm --filter web lint

      - name: Typecheck web
        run: pnpm --filter web typecheck

      - name: Build web
        run: pnpm --filter web build
