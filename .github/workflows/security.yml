name: Security checks

on:
  push:
    branches:
      - main
      - feature/core-commerce-foundation
      - "release/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One-time branch-scoped lockfile refresh; gated by the push commit message.
  refresh-patched-lockfile:
    if: github.repository == 'kaanb-wiascode/beauty' && github.ref == 'refs/heads/feature/core-commerce-foundation' && contains(github.event.head_commit.message, '[refresh-lockfile]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v6
        with:
          ref: feature/core-commerce-foundation
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Regenerate patched lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify no high or critical production vulnerabilities
        run: pnpm audit --prod --audit-level=high

      - name: Commit reproducible dependency lockfile
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile updates were needed."
            exit 0
          fi
          git -c user.name='valoo-dependency-bot' -c user.email='valoo-dependency-bot@users.noreply.github.com' \
            commit -m 'fix(security): regenerate patched pnpm lockfile'
          git push origin HEAD:feature/core-commerce-foundation

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Block high and critical production dependency vulnerabilities
        run: pnpm audit --prod --audit-level=high --json

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
