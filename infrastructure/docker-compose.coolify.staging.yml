name: valoo-staging-coolify

services:
  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RELEASE_SHA: ${RELEASE_SHA:?RELEASE_SHA is required}
      PORT: 3000
      TRUST_PROXY: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-eu-central-1}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:?OBJECT_STORAGE_ENDPOINT is required}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?OBJECT_STORAGE_ACCESS_KEY_ID is required}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?OBJECT_STORAGE_SECRET_ACCESS_KEY is required}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-false}
      OBJECT_STORAGE_PRESIGN_TTL_SECONDS: ${OBJECT_STORAGE_PRESIGN_TTL_SECONDS:-300}
      OBJECT_STORAGE_MAX_BYTES: ${OBJECT_STORAGE_MAX_BYTES:-26214400}
      REPORT_EXPORT_STORAGE_DRIVER: object
      REPORT_EXPORT_WORKER_ENABLED: "true"
      REPORT_EXPORT_RETENTION_DAYS: ${REPORT_EXPORT_RETENTION_DAYS:-7}
      REPORT_EXPORT_WORKER_POLL_MS: ${REPORT_EXPORT_WORKER_POLL_MS:-5000}
      REPORT_EXPORT_WORKER_BATCH_SIZE: ${REPORT_EXPORT_WORKER_BATCH_SIZE:-5}
      REPORT_EXPORT_EXPIRY_BATCH_SIZE: ${REPORT_EXPORT_EXPIRY_BATCH_SIZE:-100}
      REPORT_EXPORT_STALE_PROCESSING_MINUTES: ${REPORT_EXPORT_STALE_PROCESSING_MINUTES:-30}
      REPORT_EXPORT_STALE_BATCH_SIZE: ${REPORT_EXPORT_STALE_BATCH_SIZE:-100}
      REPORT_EXPORT_ACTIVE_JOB_LIMIT: ${REPORT_EXPORT_ACTIVE_JOB_LIMIT:-3}
      REPORT_EXPORT_ROW_LIMIT: ${REPORT_EXPORT_ROW_LIMIT:-50000}
      REPORT_SCHEDULE_BATCH_SIZE: ${REPORT_SCHEDULE_BATCH_SIZE:-5}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RELEASE_SHA: ${RELEASE_SHA:?RELEASE_SHA is required}
      PORT: 3001
      API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
