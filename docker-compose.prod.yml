services:
  postgres:
    image: postgres:17-alpine
    container_name: valoo-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-valoo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-valoo_erp}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-valoo_admin} -d ${POSTGRES_DB:-valoo_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - valoo_internal

  redis:
    image: redis:8-alpine
    container_name: valoo-redis
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - valoo_internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: valoo-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-valoo_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-valoo_erp}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - valoo_internal
      - valoo_gateway

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: valoo-admin
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      API_URL: http://api:3000
    depends_on:
      - api
    networks:
      - valoo_internal
      - valoo_gateway

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: valoo-web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      API_URL: http://api:3000
    depends_on:
      - api
    networks:
      - valoo_internal
      - valoo_gateway

  nginx:
    image: nginx:alpine
    container_name: valoo-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/valoo.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - admin
      - web
    networks:
      - valoo_gateway

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  valoo_internal:
    driver: bridge
  valoo_gateway:
    driver: bridge
